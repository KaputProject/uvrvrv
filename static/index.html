<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Slik - Kamera</title>
</head>
<body>
    <div class="container">
        <h1>Analiza Slik iz Kamere</h1>
        
        <div class="status" id="status">Kamera ni aktivna</div>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        
        <div class="buttons">
            <button id="zacniBtn" onclick="zacniKamero()">Zaženi kamero</button>
            <button id="zajemiBtn" onclick="zajemiInPoslji()" disabled>Zajemi in analiziraj</button>
        </div>
        
        <div class="rezultat" id="rezultat"></div>
        
        <div class="zgodovina">
            <h2>Zgodovina analiz</h2>
            <button onclick="naloziZgodovino()">Osveži zgodovino</button>
            <table id="zgodovinaTabela">
                <thead>
                    <tr>
                        <th>Čas</th>
                        <th>Povprečje</th>
                        <th>Velikost</th>
                    </tr>
                </thead>
                <tbody id="zgodovinaTelo">
                    <tr><td colspan="3" style="text-align: center;">Ni podatkov</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const zacniBtn = document.getElementById('zacniBtn');
        const zajemiBtn = document.getElementById('zajemiBtn');
        const rezultatDiv = document.getElementById('rezultat');
        
        let stream = null;

        async function zacniKamero() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: 640, 
                        height: 480 
                    } 
                });
                
                video.srcObject = stream;
                status.textContent = 'Kamera aktivna';
                status.style.color = 'green';
                zajemiBtn.disabled = false;
                zacniBtn.textContent = 'Ustavi kamero';
                zacniBtn.onclick = ustaviKamero;
                
            } catch (error) {
                console.error('Napaka pri dostopu do kamere:', error);
                status.textContent = 'Napaka: ' + error.message;
                status.style.color = 'red';
            }
        }

        function ustaviKamero() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                status.textContent = 'Kamera ustavljena';
                status.style.color = '#666';
                zajemiBtn.disabled = true;
                zacniBtn.textContent = 'Zaženi kamero';
                zacniBtn.onclick = zacniKamero;
            }
        }

        async function zajemiInPoslji() {
            // Nastavi canvas na velikost videa
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Zajemi trenutni frame
            ctx.drawImage(video, 0, 0);
            
            // Pretvori v blob
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    prikaziRezultat('Napaka pri zajemu slike', false);
                    return;
                }
                
                // Pripravi form data
                const formData = new FormData();
                formData.append('slika', blob, 'zajeta_slika.png');
                formData.append('cas', new Date().toISOString());
                
                try {
                    status.textContent = '⏳ Pošiljam na strežnik...';
                    zajemiBtn.disabled = true;
                    
                    const response = await fetch('/analiziraj', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (data.status === 'uspeh') {
                        prikaziRezultat(
                            `Uspešno!<br>
                            Povprečna vrednost: <strong>${data.povprecna_vrednost.toFixed(2)}</strong><br>
                            Velikost: ${data.velikost_slike.visina}x${data.velikost_slike.sirina}`,
                            true
                        );
                        naloziZgodovino();
                    } else {
                        prikaziRezultat('Napaka: ' + data.napaka, false);
                    }
                    
                    status.textContent = 'Kamera aktivna';
                    zajemiBtn.disabled = false;
                    
                } catch (error) {
                    console.error('Napaka pri pošiljanju:', error);
                    prikaziRezultat('Napaka pri komunikaciji s strežnikom', false);
                    status.textContent = 'Napaka pri pošiljanju';
                    zajemiBtn.disabled = false;
                }
            }, 'image/png');
        }

        function prikaziRezultat(sporocilo, uspeh) {
            rezultatDiv.innerHTML = sporocilo;
            rezultatDiv.className = 'rezultat ' + (uspeh ? 'uspeh' : 'napaka');
            rezultatDiv.style.display = 'block';
            
            // Skrij po 5 sekundah
            setTimeout(() => {
                rezultatDiv.style.display = 'none';
            }, 5000);
        }

        async function naloziZgodovino() {
            try {
                const response = await fetch('/zgodovina');
                const data = await response.json();
                
                const telo = document.getElementById('zgodovinaTelo');
                
                if (data.rezultati.length === 0) {
                    telo.innerHTML = '<tr><td colspan="3" style="text-align: center;">Ni podatkov</td></tr>';
                    return;
                }
                
                telo.innerHTML = data.rezultati
                    .slice(-10)  // Zadnjih 10
                    .reverse()   // Najnovejši na vrh
                    .map(r => `
                        <tr>
                            <td>${new Date(r.cas).toLocaleString('sl-SI')}</td>
                            <td>${parseFloat(r.povprecna_vrednost).toFixed(2)}</td>
                            <td>${r.velikost_slike}</td>
                        </tr>
                    `).join('');
                    
            } catch (error) {
                console.error('Napaka pri nalaganju zgodovine:', error);
            }
        }

        // Naloži zgodovino ob zagonu
        window.onload = naloziZgodovino;
    </script>
</body>
</html>

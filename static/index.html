<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Slik</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .main { display: flex; gap: 32px; padding: 32px; }
        .left, .right { flex: 1; }
        .preview-img { max-width: 100%; max-height: 400px; border: 1px solid #ccc; margin-top: 16px; }
        .json-box { background: #f8f8f8; border: 1px solid #ccc; padding: 16px; white-space: pre-wrap; word-break: break-all; }
        .buttons { margin-bottom: 16px; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">Analiza Slik</h1>
    <div class="main">
        <div class="left">
            <div class="buttons">
                <input type="file" id="slikaInput" accept="image/*">
                <button id="analizirajSlikoBtn" disabled>Analiziraj sliko</button>
            </div>
            <img id="preview" class="preview-img" style="display:none;">
        </div>
        <div class="right">
            <h2>JSON rezultat</h2>
            <div id="jsonResult" class="json-box"></div>
        </div>
    </div>
    <script>
        const slikaInput = document.getElementById('slikaInput');
        const analizirajSlikoBtn = document.getElementById('analizirajSlikoBtn');
        const preview = document.getElementById('preview');
        const jsonResult = document.getElementById('jsonResult');
        let selectedFile = null;

        slikaInput.addEventListener('change', () => {
            if (slikaInput.files.length > 0) {
                selectedFile = slikaInput.files[0];
                analizirajSlikoBtn.disabled = false;
                const reader = new FileReader();
                reader.onload = e => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
            } else {
                preview.style.display = 'none';
                analizirajSlikoBtn.disabled = true;
                selectedFile = null;
            }
            jsonResult.textContent = '';
        });

        analizirajSlikoBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            const formData = new FormData();
            formData.append('slika', selectedFile, selectedFile.name || 'slika.png');
            formData.append('cas', new Date().toISOString());
            jsonResult.textContent = 'Pošiljam...';

            try {
                const response = await fetch('/test', { method: 'POST', body: formData });
                const data = await response.json();
                jsonResult.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                jsonResult.textContent = 'Napaka pri komunikaciji s strežnikom.';
            }
        });
    </script>
</body>
</html>
